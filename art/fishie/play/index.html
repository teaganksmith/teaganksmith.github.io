<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FISHIE — a small thing in a large ocean</title>
    <style>
      /* The palette is the game's own: the abyss ink it paints its background
         with, the near-white that only ever means alive, and the electric
         yellow that in this game means exactly one thing — you can touch
         this. So it is spent on one word here and nowhere else. Committed to
         a single dark theme: a light mode for a game about how light dies
         with depth would be arguing with the subject. */
      :root {
        --abyss: #03151f;
        --ink: #e6efeb;
        --muted: #6f8b8b;
        --elec: #e8d45c;
        --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
        color-scheme: dark;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: var(--abyss);
        color: var(--ink);
        font-family: var(--mono);
        height: 100vh;
        overflow: hidden;
      }
      #stage { display: block; width: 100vw; height: 100vh; outline: none; }
      #stage:focus-visible { box-shadow: inset 0 0 0 2px var(--elec); }

      /* One strip, floating over the water, never in the way of a click. */
      .strip {
        position: fixed;
        left: 0; right: 0; bottom: 0;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 20px;
        padding: 10px 18px 12px;
        background: linear-gradient(to top, rgba(3, 21, 31, 0.86), rgba(3, 21, 31, 0));
        font-size: 11px;
        color: var(--muted);
        pointer-events: none;
      }
      .title {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink);
      }
      .keys { display: flex; gap: 14px; flex-wrap: wrap; }
      .keys b { font-weight: 600; color: var(--ink); }
      .go { color: var(--elec); }

      #announce {
        position: absolute;
        width: 1px; height: 1px;
        margin: -1px; padding: 0; border: 0;
        clip-path: inset(50%);
        overflow: hidden; white-space: nowrap;
      }
    </style>
  </head>
  <body>
<canvas id="stage" tabindex="0" autofocus aria-label="FISHIE game view"></canvas>
    <p id="announce" role="status" aria-live="polite"></p>

    <div class="strip">
      <span class="title">Fishie</span>
      <span class="keys">
        <span><b>wasd</b> swim</span>
        <span><b>j</b> bite</span>
        <span><b>shift</b> drift unseen</span>
        <span><b>tab</b> chart</span>
        <span><b>c</b> codex</span>
        <span><b>2 3 4</b> take a body</span>
        <span><b>r</b> start over</span>
        <span class="go">click the water first</span>
      </span>
    </div>

    <script>
      // Showcase only: fill the trophy pool with the whole bestiary so the
      // screen can be shown before anyone has played long enough to earn it.
      // Read by the front door, never written to the save — nothing here can
      // award a trophy that was not earned. Delete this line for a real build.
      window.__fishiePool = "full";
    </script>

n null;const n=JSON.parse(t);return(n==null?void 0:n.v)!==1?null:n}catch{return null}}function mn(e,t){try{localStorage.setItem(e,JSON.stringify(t))}catch{}}function fo(){return pn(wt)}function uo(e){mn(wt,e)}function bn(){try{localStorage.removeItem(wt)}catch{}}function Lt(){return pn($t)??{v:1,codex:{},finished:[],runs:0}}function po(e){mn($t,e)}function Ot(){try{localStorage.removeItem(wt),localStorage.removeItem($t)}catch{}}const mo={_:"The bestiary of the Sunlit Shallows and its tidepool. Every entry is a real taxon and every fact is true of the real animal — that is the science decision, and test/codex.test.ts enforces the shape of it. Prose is the Interspecies voice: evocative, accurate, no citations on screen. FIELDS: guild is the body it counts as for predation; size is the scale everything is compared against (the player starts at 1); hunts lists the guilds it preys on (empty = it hunts nothing you can be); behaviour drives its movement; hp/damage tune the fight; body names an entry in creatures.json.","sea-walnut":{taxon:"Mnemiopsis leidyi",common:"sea walnut",region:"shallows",guild:"soft",size:.7,hp:1,damage:0,hunts:[],behaviour:"drift",body:"walnut",reveals:["A lobed transparency, turning slowly. Light runs down its sides in coloured bands, as if it were spilling a rainbow it cannot hold.","Not a jellyfish at all, and it cannot sting: those running colours are eight rows of fused cilia beating it forward, scattering the light as they go. It eats zooplankton, fish eggs, and fish larvae — which is to say, it eats things very like you.","It carries both sexes at once and can fertilise itself, so one of them is a population waiting to happen. You have eaten the thing that eats the young. Nothing in the shallows is only prey."]},"moon-jelly":{taxon:"Aurelia aurita",common:"moon jelly",region:"shallows",guild:"soft",size:1.4,hp:3,damage:1,hunts:[],behaviour:"drift",body:"bell",reveals:["A pale disc pulsing near the surface, four horseshoes printed on it like a mark of ownership.","The four horseshoes are its gonads, showing through a bell that is mostly water. It barely swims — it pulses to stay up and lets the sea decide the rest — and it feeds by trapping plankton in mucus and walking it to its mouth on currents of cilia.","Its sting is too slight to matter to you, and that is the whole lesson: in the shallows, the things that drift are not always the things that are harmless, but this one is. Learning which is which is most of staying alive."],fight:{tell:"drift",windup:0,strike:0,recover:0,reach:20,counter:"harmless, and the whole lesson: what drifts is not always what stings",passive:!0}},"shaggy-nudibranch":{taxon:"Aeolidia papillosa",common:"shaggy mouse nudibranch",region:"shallows",guild:"soft",size:.9,hp:2,damage:0,hunts:[],behaviour:"graze",body:"slug",reveals:["A soft grey shape furred all over with fingers, crossing the rock at the pace of something with nothing to fear.","It eats sea anemones — mouth-first, into the stinging tentacles. The stinging cells it swallows are not digested but carried, still loaded, out into those fingers on its back.","It borrows its weapons from the thing that should have killed it. You are climbing a tree of life where this is a normal solution."]},"tidepool-sculpin":{taxon:"Oligocottus maculosus",common:"tidepool sculpin",region:"shallows",guild:"fish",size:1.1,hp:3,damage:1,hunts:[],behaviour:"dart",body:"sculpin",reveals:["A mottled little fish holding still against mottled rock, and then not there at all.","It lives in the pools the tide abandons, where the water can double in warmth and halve in salt between one wave and the next. When a pool drains it can breathe air for a while and simply wait.","Carry one away and it comes back — over open ground, to its own pool. Something that small keeps a map."]},"bay-pipefish":{taxon:"Syngnathus leptorhynchus",common:"bay pipefish",region:"shallows",guild:"fish",size:1,hp:2,damage:0,hunts:[],behaviour:"hover",body:"pipefish",reveals:["A green stem among green stems, hanging upright, moving only when the blades move.","It is a fish shaped like eelgrass and it lives its life pretending to be some. It has no teeth: it hunts by drifting close to a small crustacean and drawing it in through a snout like a pipette.","The male takes the eggs onto his belly, seals them in a pouch, and carries them to term. There is more than one way to be a mother."]},stickleback:{taxon:"Gasterosteus aculeatus",common:"three-spined stickleback",region:"shallows",guild:"fish",size:1.2,hp:4,damage:2,hunts:["soft"],behaviour:"patrol",body:"stickleback",reveals:["Small, quick, and coming straight at you — with three spines locked upright along its back.","The spines are a swallowing problem: raised, they turn a mouthful into an injury, and a predator that has tried once does not try twice. It hunts small soft-bodied drifters, which is a category you may be standing in.","In the breeding season the male's throat burns red, and he builds a tunnel of plant fibre glued with a secretion from his own kidneys, then fights everything that comes near it. The aggression is not temperament. It is architecture."],fight:{tell:"spines",windup:.55,strike:.2,recover:.75,reach:26,counter:"the spines lock up before it comes in — take it from behind them, or wait out the pass"}},"green-crab":{taxon:"Carcinus maenas",common:"green shore crab",region:"shallows",guild:"shelled",size:1.5,hp:6,damage:2,hunts:["soft","shelled"],behaviour:"walk",body:"crab",reveals:["It does not swim. It arrives — sideways, over the floor, claws already open.","The claws are uneven: one to crush, one to cut. It eats bivalves, snails, worms, and other crabs, and it survives water too warm, too cold, too fresh and too salty for almost anything else, which is why it now lives on coastlines that never asked for it.","The shell that protects it is also the reason it must climb out of itself to grow, and for a few hours afterwards it is the softest thing on the reef. Every armour is a debt."],fight:{tell:"claws",windup:.8,strike:.28,recover:1.3,reach:24,counter:"the claws face where it looks. go round it — a crab cannot turn as fast as you can swim"}},"purple-urchin":{taxon:"Strongylocentrotus purpuratus",common:"purple sea urchin",region:"shallows",guild:"shelled",size:1,hp:5,damage:2,hunts:[],behaviour:"cling",body:"urchin",reveals:["A purple cushion of spines, wedged into a hollow that fits it exactly.","It grazes with five teeth arranged in a lantern of muscle and bone, and it made that hollow itself, scraping at the rock for years with the same jaws it eats with. Hundreds of tube feet hold it down against surf that would move a stone.","In numbers, and with nothing to eat them, they will shear a kelp forest down to bare rock and then sit on the ruin for decades, barely feeding, waiting. The barrens are not a disaster. They are a strategy."],fight:{tell:"bristle",windup:.9,strike:.3,recover:1.2,reach:18,counter:"nothing about it comes to you. everything about it punishes arriving"}},"ochre-star":{taxon:"Pisaster ochraceus",common:"ochre star",region:"shallows",guild:"shelled",size:1.6,hp:7,damage:2,hunts:["shelled"],behaviour:"walk",body:"star",reveals:["Five arms folded over a mussel, patient as weather.","It pulls the shell open a fraction of a millimetre at a time with hundreds of tube feet, and when the gap is wide enough it pushes its own stomach through and digests the animal inside its home.","Take this one species off a shore and the mussels take everything: the diversity collapses to a single crowded band. Ecology learned the word keystone here, from an animal that eats slowly and holds a whole coastline in shape."],fight:{tell:"grip",windup:1.4,strike:.4,recover:1.6,reach:22,counter:"it is slower than weather. you are never obliged to be there"}},"great-barracuda":{taxon:"Sphyraena barracuda",common:"great barracuda",region:"shallows",guild:"fish",size:3.2,hp:12,damage:4,hunts:["fish"],behaviour:"ambush",body:"barracuda",reveals:["A long silver line in the open water, holding perfectly still, pointed at you.","It hunts by sight and it hunts fish. Everything about it is arranged for one short unanswerable burst — and it is uninterested in armour and uninterested in jelly, so what it does next depends entirely on what you have become.","It waits motionless because the wait is the weapon; the strike is only the end of it. You have watched it choose, and not to choose you, and learned the shape of the shallows' whole argument: what hunts you is decided by what you are."],fight:{tell:"still",windup:1.1,strike:.16,recover:1.7,reach:34,counter:"it goes rigid and points before it goes. move off the line, not away from it — you cannot outrun the burst, only leave it"}},"sea-nettle":{taxon:"Chrysaora fuscescens",common:"Pacific sea nettle",region:"shallows",guild:"soft",size:2,hp:5,damage:3,hunts:["soft","fish"],behaviour:"drift",body:"nettle",reveals:["A gold bell trailing metres of ruin, pulsing without hurry, taking up more of the water than it seems to occupy.","The tentacles are a drift net of stinging cells that fire on contact, faster than anything you can decide; the frilled oral arms carry what they catch up to the bell. It does not chase. It does not need to.","Where conditions favour their polyps — warm, still, emptied of the fish that would have competed — they arrive in numbers that turn open water into a wall. A bloom is not an animal. It is an answer to a question the ocean was asked."],fight:{tell:"trail",windup:0,strike:0,recover:0,reach:30,counter:"the bell is not the danger. the danger is the metres of it you cannot see",passive:!0}},anemonefish:{taxon:"Amphiprion ocellaris",common:"clown anemonefish",region:"labyrinth",guild:"fish",size:.9,hp:3,damage:1,hunts:[],behaviour:"patrol",body:"clownfish",reveals:["Orange banded white, never more than a body's length from the same anemone, and furious about it.","It lives inside a wall of stinging tentacles that would kill a fish its size, protected by a coat of mucus the anemone reads as its own. In return it drives off the fish that would eat the anemone and fans clean water through it at night.","Every one of them is born male. The largest becomes female, the second largest becomes her mate, and the rest wait in line without breeding — so killing the wrong one does not empty a place, it reorders it."]},"coral-grouper":{taxon:"Plectropomus pessuliferus",common:"roving coralgrouper",region:"labyrinth",guild:"fish",size:2.6,hp:10,damage:3,hunts:["fish"],behaviour:"patrol",body:"grouper",reveals:["A heavy red-brown fish quartering the open water, stopping to stand on its head in front of a hole.","It hunts the open reef and cannot follow anything into a crevice — so it fetches something that can. It swims to a moray, shakes its head until the eel comes out, and leads it to the hiding place.","At the hole it points: an upside-down headstand, head shaking, held until the partner looks. It is aimed at an object, useless by itself, aimed at an audience, and repeated until answered — which is the definition of a gesture that refers. Nothing about this reef is as simple as teeth."],fight:{tell:"gape",windup:.7,strike:.18,recover:1.25,reach:30,counter:"the gill covers flare a moment before the gulp. it feeds by suction, so the safe place is beside it, never in front"}},"giant-moray":{taxon:"Gymnothorax javanicus",common:"giant moray",region:"labyrinth",guild:"fish",size:3.4,hp:14,damage:4,hunts:["fish","shelled"],behaviour:"ambush",body:"moray",reveals:["A mouth in the rock, opening and closing, and no visible animal attached to it.","The gaping is breathing, not threat — it has no gill covers to pump with. It hunts crevices at night, which is the half of the reef a grouper cannot reach, and the two of them will hunt it together.","It cannot suck prey in, because there is no room in a crack to expand a throat. So it keeps a second set of jaws in its gullet, and they lunge forward into the mouth to seize what the first set has caught and drag it down. You will not get anything back once it closes."],fight:{tell:"gape",windup:.95,strike:.22,recover:1.6,reach:32,counter:"it draws back into the hole before it comes out of it. the long reset is the opening — it has to haul itself home"}},"day-octopus":{taxon:"Octopus cyanea",common:"day octopus",region:"labyrinth",guild:"soft",size:2.2,hp:8,damage:3,hunts:["shelled"],behaviour:"graze",body:"octopus",reveals:["A piece of the reef detaches, crosses the sand, and becomes reef again.","It changes colour in a heartbeat with pigment sacs it opens by muscle, and changes *texture* too, raising the skin into spikes and lumps to match coral or rubble. It hunts by pouncing on a coral head with its arms spread into a net and feeling out whatever is underneath.","It is colour-blind. Every one of those matches is made without seeing a single colour — by light through the skin, by touch, by knowing what a place ought to look like. It solves the problem by understanding the room."],fight:{tell:"spread",windup:.85,strike:.3,recover:1.45,reach:26,counter:"the arms open into a net before the pounce. get above it — the net only closes downward"}},lionfish:{taxon:"Pterois volitans",common:"red lionfish",region:"labyrinth",guild:"fish",size:1.8,hp:7,damage:4,hunts:["fish"],behaviour:"hover",body:"lionfish",reveals:["Banded and unhurried, all its fins spread wide, drifting toward you as if there were nothing to fear.","Eighteen venomous spines say what the slowness means. It herds small fish with those spread fins, then takes them with a strike too fast to follow.","As it closes it blows a jet of water at the fish it is hunting. The prey turns to face the current — and a fish that turns to face it is a fish that goes down head-first and cannot lodge. It is not confusing them. It is aiming them."],fight:{tell:"flare",windup:1.2,strike:.14,recover:1.05,reach:28,counter:"the spread fins are a fence, not a threat: it is herding you. break sideways out of the fan before the jet turns you"}},"mantis-shrimp":{taxon:"Odontodactylus scyllarus",common:"peacock mantis shrimp",region:"labyrinth",guild:"shelled",size:1.3,hp:9,damage:5,hunts:["shelled","soft"],behaviour:"cling",body:"mantis",reveals:["Green and gold, jammed in a burrow, watching you with two eyes that move independently.","It kills with a club on a spring-loaded arm. The strike accelerates like a bullet and it does not need to connect: the water behind it boils into a cavitation bubble that collapses with a second blow and a flash of light.","Its eyes carry a dozen kinds of colour receptor to your handful, and read polarised light besides — yet it discriminates colour worse than you do. It is not seeing more finely. It is seeing *faster*, in one pass, with no thinking in between."],fight:{tell:"cock",windup:.45,strike:.08,recover:1.9,reach:22,counter:"the club cocks and there is no dodging what follows. the counter is distance — but the reset is enormous, and that is the whole fight"}},"blacktip-shark":{taxon:"Carcharhinus melanopterus",common:"blacktip reef shark",region:"labyrinth",guild:"fish",size:4.2,hp:18,damage:5,hunts:["fish","soft"],behaviour:"patrol",body:"reefshark",reveals:["A shape holding the edge of the light, every fin tipped in black, never once stopping.","It patrols the shallow reef margin in water sometimes barely deep enough to cover it, and it finds you long before you find it — pits in its snout read the faint electric field of a beating heart.","It is faithful to a stretch of reef for years, and it returns to the same few hundred metres to give birth. The thing that hunts you here is not passing through. It lives here, and you are the visitor."],fight:{tell:"circle",windup:1.3,strike:.2,recover:1.15,reach:36,counter:"it passes once to measure you. the pass is the tell; the second approach is the real one"}},"long-spined-urchin":{taxon:"Diadema antillarum",common:"long-spined urchin",region:"labyrinth",guild:"shelled",size:1.4,hp:6,damage:3,hunts:[],behaviour:"cling",body:"diadema",reveals:["A black star of spines longer than its body, swinging them toward whatever moves near it.","The spines are hollow, brittle and barbed: they break off inside whatever pushes against them and stay there. It tracks shadow with light-sensing skin and aims before contact.","In 1983 something killed them across the whole Caribbean in a year, and with the grazer gone the algae buried the reefs and the corals never came back. One animal, no eyes, no brain, holding an ocean open."],fight:{tell:"aim",windup:.7,strike:.25,recover:1.1,reach:24,counter:"it aims at your shadow before you touch it. approach from the light and it swings the wrong way"}},"giant-clam":{taxon:"Tridacna gigas",common:"giant clam",region:"labyrinth",guild:"shelled",size:2.8,hp:12,damage:2,hunts:[],behaviour:"cling",body:"clam",reveals:["A metre of shell wedged into the reef, and between its lips a mantle of impossible colour, closing when your shadow crosses it.","It is not filtering for a living. It farms: the mantle is packed with algae it houses and feeds, and it grows lenses of its own tissue to pipe sunlight down to them.","It settles once as a larva and never moves again, and it can live a century. Everything it will ever have is decided by where it lands. You have a lineage and a direction. It had one afternoon."],fight:{tell:"close",windup:.6,strike:.12,recover:2.2,reach:18,counter:"it shuts on a shadow. give it one to shut on, and it is open for a long time afterward"}},"spanish-dancer":{taxon:"Hexabranchus sanguineus",common:"Spanish dancer",region:"labyrinth",guild:"soft",size:1.6,hp:4,damage:1,hunts:[],behaviour:"drift",body:"dancer",reveals:["Blood red, the size of your whole body, unrolling its edges and swimming — a slug that decided to fly.","It eats sponges, and it keeps what they were defending themselves with. The toxins pass through it unspoiled and out into its own skin, which is why nothing that colour needs to hide.","It lays its eggs in a ribbon coiled like a rose, laced with the same poison, and leaves them in the open where anything could take them. Nothing does."]},"sea-hare":{taxon:"Aplysia californica",common:"California sea hare",region:"kelp",guild:"soft",size:1.5,hp:4,damage:0,hunts:[],behaviour:"graze",body:"seahare",reveals:["A soft brown mass the colour of the weed it is eating, two folds standing up off its head like ears.","It grazes red algae and takes their pigment for its own, which is why it matches whatever it has been eating. Threatened, it releases a cloud of purple ink and a second, sticky white secretion that jams a predator's sense of smell.","Its nerve cells are large enough to see without a lens, and a handful of them are enough to run a reflex — which is how this animal taught us where a memory is kept. Something here learned what learning is."]},"red-urchin":{taxon:"Mesocentrotus franciscanus",common:"red sea urchin",region:"kelp",guild:"shelled",size:1.6,hp:8,damage:3,hunts:[],behaviour:"cling",body:"redurchin",reveals:["A wide crimson pincushion on bare rock, spines longer than the urchins above, moving imperceptibly.","It grazes drift kelp rather than hunting it down, catching blades as they tumble past and holding them under its spines. Where the drift fails it turns on the living forest instead.","Some of these are older than any tree you will ever pass, and they show no sign of ageing — no decline in feeding, in growth, in the ability to breed. It is not that it survives a century. It is that a century does not seem to happen to it."]},"spiny-lobster":{taxon:"Panulirus interruptus",common:"California spiny lobster",region:"kelp",guild:"shelled",size:2.4,hp:11,damage:4,hunts:["shelled","soft"],behaviour:"walk",body:"lobster",reveals:["Antennae first out of a crevice, longer than the animal behind them, sweeping the water where you are.","It has no crushing claws at all. What it has is armour, spines, and those antennae, and it feeds at night on snails, urchins and anything slower than it is.","Grip one and it screams. A file at the base of each antenna drags against a plate and sticks and slips into a rasp you feel as much as hear — and it makes the sound only once something has already got hold of it. It is not a warning. It is a demand to be dropped."],fight:{tell:"rasp",windup:.75,strike:.24,recover:1.35,reach:26,counter:"it screams only once something already has hold of it. let go and it has nothing left to say"}},"sunflower-star":{taxon:"Pycnopodia helianthoides",common:"sunflower star",region:"kelp",guild:"shelled",size:3,hp:13,damage:3,hunts:["shelled"],behaviour:"walk",body:"sunstar",reveals:["A soft orange wheel of twenty-odd arms flowing over the rock faster than a star has any business moving.","It runs on fifteen thousand tube feet and it hunts urchins, which flee from it — the smell alone is enough to move a barren. It swallows what it catches whole and turns it out again as a shell.","A wasting disease took nine in ten of them across thousands of kilometres of coast in a few years, and the urchins were released, and the forests went with them. You are looking at the reason a kelp forest is still standing."],fight:{tell:"flow",windup:1.1,strike:.35,recover:1.5,reach:24,counter:"faster than a star should be and still slower than you. it wins by never stopping"}},"giant-octopus":{taxon:"Enteroctopus dofleini",common:"giant Pacific octopus",region:"kelp",guild:"soft",size:3.6,hp:16,damage:5,hunts:["shelled","fish"],behaviour:"ambush",body:"gpo",reveals:["A den mouth walled with empty shells, and inside it something folded up far larger than the gap it came through.","It is the largest octopus there is and it has no bones at all, so anything its beak will pass, it will pass. It hunts crabs, clams and fish, and the midden of shells outside a den is a record of everything it has eaten.","It breeds once. The female seals herself in with her eggs, blows water over them for half a year and does not eat once in all that time, and when they hatch she dies. Everything it will ever be is spent in a single season, on purpose."],fight:{tell:"spread",windup:1,strike:.32,recover:1.7,reach:30,counter:"it comes out of the den already open. the den is the tell — the shells outside it are everything it has eaten"}},sheephead:{taxon:"Semicossyphus pulcher",common:"California sheephead",region:"kelp",guild:"fish",size:2.8,hp:12,damage:4,hunts:["shelled"],behaviour:"patrol",body:"sheephead",reveals:["Black head, red middle, white chin, and a set of front teeth that project like a tool.","It works the rock turning over urchins to get at the soft underside, and crushes what it takes with a second set of plates in its throat. Where these are fished out, the urchins win and the forest goes.","Every one of them is born female. The largest fish in a group becomes male, changes colour, changes shape, grows the forehead — and if he is taken, the next female becomes him. Sex here is a position, not a fact."],fight:{tell:"root",windup:.8,strike:.2,recover:1.2,reach:28,counter:"it hits with the front teeth and crushes with the throat. the first is survivable and the second is not — do not be held"}},lingcod:{taxon:"Ophiodon elongatus",common:"lingcod",region:"kelp",guild:"fish",size:3.4,hp:15,damage:5,hunts:["fish","soft"],behaviour:"ambush",body:"lingcod",reveals:["A long mottled shape lying along a ledge, entirely still, with a mouth that does not close properly.","Eighteen big teeth and a bite that takes fish nearly its own length. It does not chase — it waits on the bottom in the current and takes what passes over.","The male guards the eggs, and does not leave them, and does not feed while he does it. Pull him off the nest and it is stripped in minutes by the animals that were waiting for exactly that."],fight:{tell:"still",windup:1,strike:.15,recover:1.55,reach:34,counter:"it does not chase. it lies flat and takes what passes over, so the counter is simply not to pass over"}},yelloweye:{taxon:"Sebastes ruberrimus",common:"yelloweye rockfish",region:"kelp",guild:"fish",size:2.6,hp:11,damage:3,hunts:[],behaviour:"hover",body:"rockfish",reveals:["Orange-red and heavy-bodied, hanging almost motionless against the rock with a bright yellow eye.","It holds a patch of reef and barely leaves it. It bears live young rather than laying, tens of thousands at a time, and the oldest females produce the strongest of them.","One of these can be older than a hundred years, and it does not breed until it is twenty. A population is a century of accumulation, and it can be spent in a decade."]},ratfish:{taxon:"Hydrolagus colliei",common:"spotted ratfish",region:"kelp",guild:"fish",size:2.2,hp:9,damage:4,hunts:["shelled"],behaviour:"dart",body:"ratfish",reveals:["White-spotted, huge-eyed, driving itself with slow beats of wing-like fins and a tail drawn out to a thread.","Not a bony fish and not a shark: a chimaera, off the same branch as the sharks and separate from them for longer than there have been trees. Its jaw plates crush shellfish; its eyes glow green in a light.","The first spine of its back fin is venomous, and it carries it upright. This is one of the oldest designs still swimming, and it did not need to be improved."],fight:{tell:"raise",windup:.85,strike:.26,recover:1.25,reach:24,counter:"the first spine of the back fin goes up first, and it is venomous. everything else about it is slow"}}},bo={0:"unknown",1:"seen",2:"known",3:"understood"},yo={observed:1,close:1,ate:2,eaten:2,ignored:2,felled:3},yn=Object.fromEntries(Object.entries(mo).filter(([e])=>!e.startsWith("_")));function kt(){return Object.keys(yn)}function qe(e){return yn[e]??null}class go{constructor(t={}){$(this,"levels",new Map);$(this,"pending",[]);for(const[n,o]of Object.entries(t))this.levels.set(n,Math.max(0,Math.min(3,Math.round(o))))}level(t){return this.levels.get(t)??0}encounter(t,n){const o=this.level(t),a=yo[n];return a<=o?null:(this.levels.set(t,a),this.pendin
